<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SUPER MARIO 3D BROS. - 3D精细建模高清重制版 (World 1-1)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #ffffff;
    }
    #game-canvas-container {
      width: 100%; height: 100%; position: relative;
    }

    /* Top Nintendo-Style Clean Single-Row HUD */
    .hud-bar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 24px);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(250, 204, 21, 0.55);
      border-radius: 14px;
      padding: 6px 14px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 20;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .hud-bar::-webkit-scrollbar {
      display: none;
    }

    .hud-stat {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1;
    }
    .hud-label {
      font-size: 11.5px;
      font-weight: 700;
      color: #fde047;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .hud-value {
      font-size: 14.5px;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .hud-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    .hud-actions {
      display: inline-flex;
      flex-direction: row;
      gap: 8px;
      align-items: center;
      flex-wrap: nowrap;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .hud-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      height: 28px;
      line-height: 26px;
      padding: 0 10px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.18s ease;
      text-decoration: none;
    }
    .hud-btn:hover {
      background: #facc15;
      color: #0f172a;
      border-color: #facc15;
    }
    .hud-btn.accent {
      background: linear-gradient(135deg, #e11d48, #be123c);
      border-color: #fda4af;
    }
    .hud-btn.accent:hover {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #fff;
    }

    /* Back to Blog Button */
    .btn-back-blog {
      background: rgba(14, 165, 233, 0.25);
      border: 1px solid #38bdf8;
      color: #e0f2fe;
    }
    .btn-back-blog:hover {
      background: #0284c7;
      color: #fff;
    }

    /* Bottom Control Hints Bar */
    .controls-footer {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 20px);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 5px 18px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 12px;
      color: #e2e8f0;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .controls-footer::-webkit-scrollbar {
      display: none;
    }
    .ctrl-item {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1;
    }
    .key-badge {
      display: inline-block;
      background: #334155;
      color: #fde047;
      border: 1px solid #64748b;
      border-radius: 5px;
      padding: 2px 6px;
      font-weight: 800;
      font-size: 11px;
      margin-right: 4px;
      white-space: nowrap;
      line-height: 1.2;
    }

    /* Floating 3D Score Text */
    .floating-score {
      position: fixed; pointer-events: none;
      font-weight: 900; font-size: 20px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      transform: translate(-50%, -50%);
      z-index: 15;
    }

    /* Stage Clear Banner */
    .victory-banner {
      position: fixed; top: 22%; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, rgba(22, 163, 74, 0.94), rgba(21, 128, 61, 0.94));
      border: 3px solid #fde047;
      border-radius: 22px; padding: 22px 42px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.65);
      z-index: 30;
    }
    .victory-banner h1 {
      font-size: 32px; font-weight: 900; color: #fde047;
      margin-bottom: 8px;
    }
    .hidden { display: none !important; }

    /* 3D Model Turntable Inspector Modal */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(2, 6, 23, 0.82);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 50;
    }
    .inspector-card {
      background: #1e293b;
      border: 2px solid #facc15;
      border-radius: 22px;
      padding: 22px;
      width: min(92vw, 570px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.75);
      text-align: center;
    }
    #inspector-canvas {
      width: 100%; height: 320px;
      border-radius: 14px;
      border: 1px solid #334155;
      margin: 12px 0;
    }

    /* --- Mobile & iPad Touch Gamepad --- */
    .touch-controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      display: block;
    }

    .touch-controls.hidden {
      display: none !important;
    }

    /* Left Cross D-Pad */
    .touch-dpad-wrap {
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 146px;
      height: 146px;
      pointer-events: auto;
      user-select: none;
      touch-action: none;
    }

    .dpad-bg {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 41, 59, 0.72) 0%, rgba(15, 23, 42, 0.85) 100%);
      border: 2px solid rgba(250, 204, 21, 0.45);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 2px 6px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .dpad-btn {
      position: absolute;
      width: 48px;
      height: 48px;
      background: rgba(51, 65, 85, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fde047;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
      cursor: pointer;
      transition: background 0.1s, transform 0.08s, box-shadow 0.1s;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .dpad-btn:active, .dpad-btn.active {
      background: #facc15;
      color: #0f172a;
      transform: scale(0.92);
      box-shadow: 0 0 16px rgba(250, 204, 21, 0.85);
    }

    .dpad-up {
      top: 4px;
      left: 49px;
      border-radius: 12px 12px 4px 4px;
    }

    .dpad-down {
      bottom: 4px;
      left: 49px;
      border-radius: 4px 4px 12px 12px;
    }

    .dpad-left {
      top: 49px;
      left: 4px;
      border-radius: 12px 4px 4px 12px;
    }

    .dpad-right {
      top: 49px;
      right: 4px;
      border-radius: 4px 12px 12px 4px;
    }

    .dpad-center {
      top: 49px;
      left: 49px;
      background: rgba(30, 41, 59, 0.95);
      border: none;
      color: rgba(255, 255, 255, 0.25);
      font-size: 10px;
      pointer-events: none;
    }

    /* Right Action Buttons */
    .touch-action-wrap {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 176px;
      height: 156px;
      pointer-events: auto;
      user-select: none;
      touch-action: none;
    }

    .action-btn {
      position: absolute;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55), inset 0 2px 5px rgba(255, 255, 255, 0.25);
      user-select: none;
      touch-action: none;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.1s, filter 0.1s;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .action-btn .btn-key {
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .action-btn .btn-name {
      font-size: 10px;
      font-weight: 700;
      opacity: 0.95;
      line-height: 1;
      margin-top: 2px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .action-btn:active, .action-btn.active {
      transform: scale(0.90);
      filter: brightness(1.25);
    }

    /* Jump (A) Button - Big Primary */
    .btn-jump {
      bottom: 4px;
      right: 4px;
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      border-color: #86efac;
    }

    .btn-jump:active, .btn-jump.active {
      box-shadow: 0 0 24px rgba(34, 197, 94, 0.85);
    }

    /* Run / Dash (B) Button */
    .btn-run {
      bottom: 12px;
      left: 18px;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-color: #93c5fd;
    }

    .btn-run:active, .btn-run.active {
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.85);
    }

    /* Fireball (X) Button */
    .btn-fire {
      top: 8px;
      right: 44px;
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, #f97316, #dc2626);
      border-color: #fca5a5;
    }

    .btn-fire:active, .btn-fire.active {
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.85);
    }

    /* --- Responsive Queries for iPad & Mobile --- */
    @media (hover: none) and (pointer: coarse), (max-width: 900px) {
      .controls-footer {
        display: none !important;
      }
    }

    @media (max-width: 768px) {
      .hud-bar {
        top: 6px;
        padding: 4px 8px;
        gap: 6px;
        border-radius: 10px;
      }
      .hud-label {
        font-size: 10px;
      }
      .hud-value {
        font-size: 12.5px;
      }
      .hud-btn {
        font-size: 11px;
        height: 24px;
        line-height: 22px;
        padding: 0 6px;
      }
      .touch-dpad-wrap {
        bottom: 14px;
        left: 14px;
        width: 132px;
        height: 132px;
      }
      .dpad-btn {
        width: 44px;
        height: 44px;
        font-size: 16px;
      }
      .dpad-up { top: 3px; left: 44px; }
      .dpad-down { bottom: 3px; left: 44px; }
      .dpad-left { top: 44px; left: 3px; }
      .dpad-right { top: 44px; right: 3px; }
      .dpad-center { top: 44px; left: 44px; }

      .touch-action-wrap {
        bottom: 14px;
        right: 14px;
        width: 154px;
        height: 140px;
      }
      .btn-jump {
        width: 62px;
        height: 62px;
        right: 2px;
        bottom: 2px;
      }
      .btn-run {
        width: 50px;
        height: 50px;
        left: 10px;
        bottom: 8px;
      }
      .btn-fire {
        width: 48px;
        height: 48px;
        right: 38px;
        top: 6px;
      }
    }

    @media (min-width: 769px) and (max-width: 1200px) {
      /* iPad / Tablet layout */
      .touch-dpad-wrap {
        bottom: 30px;
        left: 30px;
        width: 162px;
        height: 162px;
      }
      .dpad-btn {
        width: 54px;
        height: 54px;
        font-size: 20px;
      }
      .dpad-up { top: 4px; left: 54px; }
      .dpad-down { bottom: 4px; left: 54px; }
      .dpad-left { top: 54px; left: 4px; }
      .dpad-right { top: 54px; right: 4px; }
      .dpad-center { top: 54px; left: 54px; }

      .touch-action-wrap {
        bottom: 30px;
        right: 30px;
        width: 194px;
        height: 174px;
      }
      .btn-jump {
        width: 74px;
        height: 74px;
      }
      .btn-run {
        width: 60px;
        height: 60px;
        left: 18px;
        bottom: 12px;
      }
      .btn-fire {
        width: 58px;
        height: 58px;
        right: 50px;
        top: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Top HUD -->
  <header class="hud-bar">
    <a href="index.html" class="hud-btn btn-back-blog" title="返回博客首页">🏠 返回博客</a>
    <div class="hud-divider"></div>
    <div class="hud-stat">
      <span class="hud-label">得分</span>
      <span class="hud-value" id="hud-score">000000</span>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-stat">
      <span class="hud-label">金币</span>
      <span class="hud-value" id="hud-coins">🪙 x00</span>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-stat">
      <span class="hud-label">关卡</span>
      <span class="hud-value" id="hud-world">1-1</span>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-stat">
      <span class="hud-label">时间</span>
      <span class="hud-value" id="hud-time">400</span>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-stat">
      <span class="hud-label">生命</span>
      <span class="hud-value" id="hud-lives">❤️ x3</span>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-stat" style="cursor:pointer;" onclick="window.game.cycleForm()" title="点击切换马里奥形态 (小/大/火)">
      <span class="hud-label">形态</span>
      <span class="hud-value" id="hud-form" style="color:#4ade80;">小马里奥</span>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-actions">
      <button class="hud-btn" id="btn-touch-toggle" onclick="window.game.toggleTouchControls()" title="显示/隐藏虚拟触控按键">🎮 手柄</button>
      <button class="hud-btn" id="btn-camera" onclick="window.game.cycleCameraMode()">🎥 视角 [C]</button>
      <button class="hud-btn" id="btn-audio" onclick="const m=window.game.audio.toggleMute(); this.textContent=m?'🔇 关 [M]':'🔊 开 [M]'">🔊 开 [M]</button>
      <button class="hud-btn accent" onclick="window.inspector.toggle(true)">🔍 3D展台</button>
    </div>
  </header>

  <!-- Victory Banner -->
  <div id="victory-banner" class="victory-banner hidden">
    <h1>🎉 WORLD 1-1 STAGE CLEAR! 🎉</h1>
    <p style="font-size:15px; margin-bottom:14px;">恭喜通关！礼花正在城堡上空绽放！</p>
    <button class="hud-btn" style="background:#fde047; color:#0f172a; font-size:14px; padding:9px 20px;" onclick="document.getElementById('victory-banner').classList.add('hidden'); window.game.isStageClear=false; window.game.buildLevel(); window.game.resetPlayerPosition(2.5, 2.0);">🔄 再玩一次 (Replay World 1-1)</button>
  </div>

  <!-- 360° 3D Model Turntable Inspector Modal -->
  <div id="inspector-modal" class="modal-backdrop hidden">
    <div class="inspector-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="color:#fde047; font-size:18px;">🔍 360° 3D高精度角色与怪物建模展台</h3>
        <button class="hud-btn" onclick="window.inspector.toggle(false)">✖ 关闭</button>
      </div>
      <canvas id="inspector-canvas" width="520" height="360"></canvas>
      <h4 id="inspector-title" style="color:#38bdf8; font-size:16px; margin-bottom:6px;"></h4>
      <p id="inspector-desc" style="color:#cbd5e1; font-size:13px; line-height:1.5; margin-bottom:14px;"></p>
      <div style="display:flex; justify-content:center; gap:12px;">
        <button class="hud-btn" onclick="window.inspector.selectEntry(window.inspector.currentModelIndex - 1)">◀ 上一个模型</button>
        <button class="hud-btn accent" onclick="window.inspector.selectEntry(window.inspector.currentModelIndex + 1)">下一个模型 ▶</button>
      </div>
    </div>
  </div>

  <!-- Main WebGL Container -->
  <div id="game-canvas-container"></div>

  <!-- Mobile & iPad Virtual Touch Gamepad -->
  <div id="touch-controls" class="touch-controls">
    <!-- Left Cross D-Pad -->
    <div class="touch-dpad-wrap" id="touch-dpad">
      <div class="dpad-bg"></div>
      <button class="dpad-btn dpad-up" id="btn-touch-up" type="button" aria-label="上/跳跃">
        <span>▲</span>
      </button>
      <button class="dpad-btn dpad-left" id="btn-touch-left" type="button" aria-label="向左走">
        <span>◀</span>
      </button>
      <button class="dpad-btn dpad-center" type="button" tabindex="-1">
        <span>●</span>
      </button>
      <button class="dpad-btn dpad-right" id="btn-touch-right" type="button" aria-label="向右走">
        <span>▶</span>
      </button>
      <button class="dpad-btn dpad-down" id="btn-touch-down" type="button" aria-label="下蹲/钻管道">
        <span>▼</span>
      </button>
    </div>

    <!-- Right Action Buttons -->
    <div class="touch-action-wrap">
      <!-- Fireball (X) -->
      <button class="action-btn btn-fire" id="btn-touch-fire" type="button" aria-label="发射火球">
        <span class="btn-key">X</span>
        <span class="btn-name">火球</span>
      </button>

      <!-- Dash / Run (B) -->
      <button class="action-btn btn-run" id="btn-touch-run" type="button" aria-label="按住加速">
        <span class="btn-key">B</span>
        <span class="btn-name">加速</span>
      </button>

      <!-- Jump (A) -->
      <button class="action-btn btn-jump" id="btn-touch-jump" type="button" aria-label="跳跃">
        <span class="btn-key">A</span>
        <span class="btn-name">跳跃</span>
      </button>
    </div>
  </div>

  <!-- Bottom Controls Bar -->
  <footer class="controls-footer">
    <span class="ctrl-item"><b class="key-badge">A / D</b>移动</span>
    <span class="ctrl-item"><b class="key-badge">W / 空格</b>跳跃</span>
    <span class="ctrl-item"><b class="key-badge">Shift</b>加速</span>
    <span class="ctrl-item"><b class="key-badge">J / X</b>火球</span>
    <span class="ctrl-item"><b class="key-badge">S / ▼</b>钻水管</span>
    <span class="ctrl-item"><b class="key-badge">1 / 2 / 3</b>换形态</span>
    <span class="ctrl-item"><b class="key-badge">C</b>换视角</span>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script>
// ============================================================================
// Super Mario 3D Bros - Web Audio API Chiptune & SFX Synthesizer
// Authentic NES/SNES Multi-Channel Square + Triangle + Noise Synthesizer
// ============================================================================

class MarioAudioEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.bgmPlaying = false;
    this.currentTheme = 'overworld'; // 'overworld' | 'underground' | 'star' | 'none'
    this.bgmTimeout = null;
    this.stepIndex = 0;
    this.masterGain = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.32;
      this.masterGain.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.masterGain) {
      this.masterGain.gain.value = this.muted ? 0 : 0.32;
    }
    return this.muted;
  }

  noteToFreq(note) {
    if (!note || note === '-') return 0;
    const notes = { 'C': 0, 'C#': 1, 'Db': 1, 'D': 2, 'D#': 3, 'Eb': 3, 'E': 4, 'F': 5, 'F#': 6, 'Gb': 6, 'G': 7, 'G#': 8, 'Ab': 8, 'A': 9, 'A#': 10, 'Bb': 10, 'B': 11 };
    const match = note.match(/^([A-G][#b]?)(\d)$/);
    if (!match) return 0;
    const semitone = notes[match[1]];
    const octave = parseInt(match[2], 10);
    return 440 * Math.pow(2, (octave - 4) + (semitone - 9) / 12);
  }

  playTone(freq, duration, type = 'square', volume = 0.25, delay = 0, slideTo = null) {
    if (this.muted) return;
    this.init();
    if (!freq || freq <= 0) return;

    const now = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + duration);
    }

    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    osc.connect(gain);
    gain.connect(this.masterGain);

    osc.start(now);
    osc.stop(now + duration + 0.01);
  }

  playNoise(duration, volume = 0.2, delay = 0, filterFreq = 1200) {
    if (this.muted) return;
    this.init();
    const now = this.ctx.currentTime + delay;
    const bufferSize = Math.floor(this.ctx.sampleRate * duration);
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(filterFreq, now);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);

    noise.start(now);
    noise.stop(now + duration);
  }

  // ---- Sound Effects ----
  playJump(isBig = false) {
    const base = isBig ? 160 : 220;
    this.playTone(base, 0.12, 'square', 0.22, 0, base * 2.2);
    this.playTone(base * 1.8, 0.18, 'square', 0.20, 0.08, base * 3.6);
  }

  playCoin() {

    this.playTone(1318.51, 0.35, 'square', 0.24, 0.075);  // E6

  playBump() {

  playBreakBlock() {

    });
  }

  playPowerUpCollect() {
    const notes = ['C4', 'E4', 'G4', 'C5', 'G4', 'C5', 'E5', 'G5', 'C6', 'G5', 'E4', 'Ab4', 'C5', 'Eb5', 'Ab5', 'C6'];
    notes.forEach((n, idx) => {
      this.playTone(this.noteToFreq(n), 0.06, 'square', 0.25, idx * 0.042);
    });
  }

  playOneUp() {
    const notes = ['E5', 'G5', 'E6', 'C6', 'D6', 'G6'];
    notes.forEach((n, idx) => {
      this.playTone(this.noteToFreq(n), 0.11, 'square', 0.28, idx * 0.095);
    });
  }

  playPipeWarp() {
    for (let i = 0; i < 6; i++) {
      this.playTone(380 - i * 45, 0.06, 'square', 0.26, i * 0.07, 180 - i * 20);
    }
  }

  playStomp() {
    this.playTone(260, 0.06, 'square', 0.28, 0, 520);
    this.playTone(520, 0.10, 'triangle', 0.25, 0.05, 840);
  }

  playKick() {
    this.playTone(180, 0.05, 'square', 0.32, 0, 620);

  }

  playFireball() {

    this.playTone(420, 0.06, 'triangle', 0.18, 0.04, 920);
  }

  playFlagpole() {
    const notes = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5', 'D5', 'E5', 'F5', 'G5', 'A5', 'B5', 'C6'];
    notes.forEach((n, idx) => {
      this.playTone(this.noteToFreq(n), 0.07, 'square', 0.22, idx * 0.05);
    });
  }

  playStageClear() {
    this.stopBGM();
    const melody = [
      ['G4', 0.13], ['C5', 0.13], ['E5', 0.13], ['G5', 0.13], ['C6', 0.13], ['E6', 0.13],
      ['G6', 0.36], ['E6', 0.34],
      ['Ab4', 0.13], ['C5', 0.13], ['Eb5', 0.13], ['Ab5', 0.13], ['C6', 0.13], ['Eb6', 0.13],

      ['Bb6', 0.38], ['Bb6', 0.12], ['Bb6', 0.12], ['Bb6', 0.12], ['C7', 0.65]
    ];
    let t = 0.1;
    melody.forEach(([n, dur]) => {
      this.playTone(this.noteToFreq(n), dur * 0.92, 'square', 0.26, t);
      this.playTone(this.noteToFreq(n) * 0.5, dur * 0.92, 'triangle', 0.22, t);

    });
  }

  playDeath() {
    this.stopBGM();
    const melody = [
      ['B4', 0.12], ['F5', 0.16], ['-', 0.08], ['F5', 0.14],
      ['F5', 0.15], ['E5', 0.15], ['D5', 0.15],
      ['C5', 0.16], ['E4', 0.16], ['-', 0.08], ['E4', 0.16], ['C4', 0.35]

      }
      t += dur;

  }

  playFirework() {
    this.playNoise(0.28, 0.38, 0, 1100);
    this.playTone(540, 0.2, 'sine', 0.22, 0, 140);
  }

  // ---- Background Music Sequencer ----
  startBGM(theme = 'overworld') {
    this.init();
    if (this.bgmPlaying && this.currentTheme === theme) return;
    this.stopBGM();
    this.currentTheme = theme;
    this.bgmPlaying = true;
    this.stepIndex = 0;
    this.scheduleNextStep();
  }

  stopBGM() {
    this.bgmPlaying = false;
    if (this.bgmTimeout) {
      clearTimeout(this.bgmTimeout);
      this.bgmTimeout = null;
    }
  }

  scheduleNextStep() {
    if (!this.bgmPlaying) return;

    // Overworld Theme (Koji Kondo classic motif)
    const overworldSeq = [
      // Intro
      ['E5', 'D4'], ['E5', 'D4'], ['-', '-'], ['E5', 'D4'],
      ['-', '-'], ['C5', 'D4'], ['E5', 'D4'], ['-', '-'],
      ['G5', 'G3'], ['-', '-'], ['-', '-'], ['-', '-'],
      ['G4', 'G3'], ['-', '-'], ['-', '-'], ['-', '-'],
      // Phrase A1
      ['C5', 'G3'], ['-', '-'], ['-', '-'], ['G4', 'E3'],
      ['-', '-'], ['-', '-'], ['E4', 'C3'], ['-', '-'],
      ['-', '-'], ['A4', 'F3'], ['-', '-'], ['B4', 'G3'],
      ['-', '-'], ['Bb4', 'Gb3'], ['A4', 'F3'], ['-', '-'],
      ['G4', 'E3'], ['E5', 'C4'], ['G5', 'E4'], ['A5', 'F4'],
      ['-', '-'], ['F5', 'D4'], ['G5', 'E4'], ['-', '-'],
      ['E5', 'C4'], ['-', '-'], ['C5', 'A3'], ['D5', 'B3'],
      ['B4', 'G3'], ['-', '-'], ['-', '-'], ['-', '-'],
      // Phrase A2
      ['C5', 'G3'], ['-', '-'], ['-', '-'], ['G4', 'E3'],
      ['-', '-'], ['-', '-'], ['E4', 'C3'], ['-', '-'],
      ['-', '-'], ['A4', 'F3'], ['-', '-'], ['B4', 'G3'],
      ['-', '-'], ['Bb4', 'Gb3'], ['A4', 'F3'], ['-', '-'],
      ['G4', 'E3'], ['E5', 'C4'], ['G5', 'E4'], ['A5', 'F4'],
      ['-', '-'], ['F5', 'D4'], ['G5', 'E4'], ['-', '-'],
      ['E5', 'C4'], ['-', '-'], ['C5', 'A3'], ['D5', 'B3'],
      ['B4', 'G3'], ['-', '-'], ['-', '-'], ['-', '-']
    ];

    // Underground Theme
    const undergroundSeq = [
      ['C4', 'C3'], ['C5', 'C4'], ['A3', 'A2'], ['A4', 'A3'],
      ['Bb3', 'Bb2'], ['Bb4', 'Bb3'], ['-', '-'], ['-', '-'],
      ['-', '-'], ['-', '-'], ['-', '-'], ['-', '-'],
      ['F3', 'F2'], ['F4', 'F3'], ['D3', 'D2'], ['D4', 'D3'],
      ['Eb3', 'Eb2'], ['Eb4', 'Eb3'], ['-', '-'], ['-', '-'],
      ['-', '-'], ['-', '-'], ['-', '-'], ['-', '-']
    ];

    // Starman Theme
    const starSeq = [
      ['C5', 'F3'], ['C5', 'F3'], ['C5', 'C4'], ['-', 'F3'],
      ['C5', 'F3'], ['-', 'C4'], ['C5', 'F3'], ['D5', 'C4'],
      ['C5', 'E3'], ['-', 'E3'], ['B4', 'B3'], ['-', 'E3'],
      ['B4', 'E3'], ['-', 'B3'], ['B4', 'E3'], ['C5', 'B3']
    ];

    let seq = overworldSeq;
    let stepMs = 125;
    if (this.currentTheme === 'underground') {
      seq = undergroundSeq;
      stepMs = 135;
    } else if (this.currentTheme === 'star') {
      seq = starSeq;
      stepMs = 95;
    }

    const [lead, bass] = seq[this.stepIndex % seq.length];
    if (lead && lead !== '-') {
      this.playTone(this.noteToFreq(lead), (stepMs / 1000) * 0.85, 'square', 0.12);
    }
    if (bass && bass !== '-') {
      this.playTone(this.noteToFreq(bass), (stepMs / 1000) * 0.9, 'triangle', 0.16);
    }

    this.stepIndex++;
    this.bgmTimeout = setTimeout(() => this.scheduleNextStep(), stepMs);
  }
}

// ============================================================================

class MarioModelFactory {
  constructor() {
    this.textures = {};

  }

  initTexturesAndMaterials() {
    // 1. Mario 'M' Cap Emblem Texture
    const emblemCanvas = document.createElement('canvas');
    emblemCanvas.width = 128;
    emblemCanvas.height = 128;
    const ectx = emblemCanvas.getContext('2d');
    ectx.fillStyle = '#ffffff';

    ectx.textBaseline = 'middle';

    this.textures.emblem = new THREE.CanvasTexture(emblemCanvas);

    // 2. Brick Block Albedo + Mortar Texture
    const brickCanvas = document.createElement('canvas');
    brickCanvas.width = 256;
    brickCanvas.height = 256;
    const bctx = brickCanvas.getContext('2d');
    bctx.fillStyle = '#7c2d12'; // dark mortar
    bctx.fillRect(0, 0, 256, 256);
    const rows = 4;
    const rowH = 256 / rows;
    for (let r = 0; r < rows; r++) {
      const offset = (r % 2) * 64;
      for (let c = -1; c < 3; c++) {
        const bx = c * 128 + offset + 5;
        const by = r * rowH + 5;
        const bw = 128 - 10;
        const bh = rowH - 10;
        const grad = bctx.createLinearGradient(bx, by, bx, by + bh);
        grad.addColorStop(0, '#d97706');
        grad.addColorStop(0.15, '#b45309');
        grad.addColorStop(0.85, '#9a3412');
        grad.addColorStop(1, '#7c2d12');
        bctx.fillStyle = grad;
        bctx.fillRect(bx, by, bw, bh);
        bctx.fillStyle = 'rgba(255,220,160,0.28)';
        bctx.fillRect(bx, by, bw, 4);
      }
    }
    this.textures.brick = new THREE.CanvasTexture(brickCanvas);

    // 3. Underground Blue Brick Texture
    const uBrickCanvas = document.createElement('canvas');
    uBrickCanvas.width = 256;
    uBrickCanvas.height = 256;
    const uctx = uBrickCanvas.getContext('2d');
    uctx.fillStyle = '#0f172a';
    uctx.fillRect(0, 0, 256, 256);
    for (let r = 0; r < rows; r++) {
      const offset = (r % 2) * 64;
      for (let c = -1; c < 3; c++) {
        const bx = c * 128 + offset + 5;
        const by = r * rowH + 5;
        const bw = 128 - 10;
        const bh = rowH - 10;

        uctx.fillRect(bx, by, bw, bh);

    qGrad.addColorStop(0.5, '#facc15');

      emptyBlock: new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.55, metalness: 0.3 }),

      koopaYellow: new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.45 })

      headGroup.add(pupil);

      const brow = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.025, 0.025), this.materials.hairBrown);
      brow.position.set(ex, 0.145, 0.265);
      brow.rotation.z = ex < 0 ? 0.15 : -0.15;
      headGroup.add(brow);
    });

    [-0.275, 0.275].forEach(earX => {
      const ear = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 12), this.materials.skin);
      ear.scale.set(0.55, 1.0, 0.85);
      ear.position.set(earX, 0.0, 0.02);
      headGroup.add(ear);

      const sideburn = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.14, 0.08), this.materials.hairBrown);
      sideburn.position.set(earX * 0.92, 0.02, 0.11);
      headGroup.add(sideburn);
    });
    const backHair = new THREE.Mesh(new THREE.SphereGeometry(0.285, 18, 14, 0, Math.PI * 2, 0.3, 1.8), this.materials.hairBrown);
    backHair.position.set(0, -0.02, -0.04);
    headGroup.add(backHair);

    const capDome = new THREE.Mesh(
      new THREE.SphereGeometry(0.305, 24, 18, 0, Math.PI * 2, 0, Math.PI * 0.58),
      capMat
    );
    capDome.position.set(0, 0.08, -0.01);
    capDome.rotation.x = -0.12;
    capDome.castShadow = true;
    headGroup.add(capDome);

    const capVisor = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.30, 0.045, 20, 1, false, -Math.PI * 0.42, Math.PI * 0.84), capMat);
    capVisor.position.set(0, 0.125, 0.15);
    capVisor.rotation.x = 0.22;
    capVisor.castShadow = true;
    headGroup.add(capVisor);

    const emblemBadge = new THREE.Mesh(
      new THREE.CircleGeometry(0.088, 20),
      new THREE.MeshStandardMaterial({ map: this.textures.emblem, roughness: 0.3 })
    );
    emblemBadge.position.set(0, 0.22, 0.288);
    emblemBadge.rotation.x = -0.18;
    headGroup.add(emblemBadge);

    const createArm = (isLeft) => {
      const armPivot = new THREE.Group();
      const side = isLeft ? -1 : 1;
      armPivot.position.set(side * 0.34, 0.14, 0);

      const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.085, 0.28, 14), shirtMat);
      upperArm.position.y = -0.12;
      upperArm.castShadow = true;
      armPivot.add(upperArm);

      const cuff = new THREE.Mesh(new THREE.TorusGeometry(0.092, 0.026, 10, 16), this.materials.marioWhite);
      cuff.rotation.x = Math.PI / 2;
      cuff.position.y = -0.25;
      armPivot.add(cuff);

      const glove = new THREE.Mesh(new THREE.SphereGeometry(0.125, 16, 16), this.materials.marioWhite);
      glove.scale.set(1.0, 1.08, 1.12);
      glove.position.y = -0.34;
      glove.castShadow = true;
      armPivot.add(glove);

      const thumb = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 10), this.materials.marioWhite);
      thumb.position.set(side * -0.08, -0.33, 0.08);
      armPivot.add(thumb);

      torsoGroup.add(armPivot);
      return armPivot;
    };
    const leftArm = createArm(true);
    const rightArm = createArm(false);

    const createLeg = (isLeft) => {
      const legPivot = new THREE.Group();
      const side = isLeft ? -1 : 1;
      legPivot.position.set(side * 0.145, 0.38, 0);

      const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.105, 0.24, 14), overallMat);
      thigh.position.y = -0.11;
      thigh.castShadow = true;
      legPivot.add(thigh);

      const bootGroup = new THREE.Group();
      bootGroup.position.set(0, -0.28, 0.04);

      const bootBody = new THREE.Mesh(new THREE.SphereGeometry(0.135, 16, 14), this.materials.bootBrown);
      bootBody.scale.set(0.95, 0.78, 1.38);
      bootBody.castShadow = true;
      bootGroup.add(bootBody);

      const sole = new THREE.Mesh(
        new THREE.BoxGeometry(0.22, 0.045, 0.34),
        new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.6 })
      );
      sole.position.set(0, -0.08, 0.01);
      bootGroup.add(sole);

      legPivot.add(bootGroup);
      model.add(legPivot);
      return legPivot;
    };
    const leftLeg = createLeg(true);
    const rightLeg = createLeg(false);

    model.rotation.y = Math.PI / 2;

    const rig = {
      root,
      model,
      torsoGroup,
      headGroup,
      leftArm,
      rightArm,
      leftLeg,
      rightLeg,
      shirtMat,
      overallMat,
      capMat,
      form: 'small',
      setForm: (formName) => {
        rig.form = formName;
        if (formName === 'small') {
          model.scale.set(0.76, 0.72, 0.76);
          headGroup.scale.set(1.18, 1.18, 1.18);
          shirtMat.color.setHex(0xe11d48);
          capMat.color.setHex(0xe11d48);
          overallMat.color.setHex(0x1d4ed8);
        } else if (formName === 'super') {
          model.scale.set(0.96, 1.05, 0.96);
          headGroup.scale.set(1.0, 1.0, 1.0);
          shirtMat.color.setHex(0xe11d48);
          capMat.color.setHex(0xe11d48);
          overallMat.color.setHex(0x1d4ed8);
        } else if (formName === 'fire') {
          model.scale.set(0.96, 1.05, 0.96);
          headGroup.scale.set(1.0, 1.0, 1.0);
          shirtMat.color.setHex(0xf8fafc);
          capMat.color.setHex(0xf8fafc);
          overallMat.color.setHex(0xdc2626);
        }
      },
      animate: (vx, vy, onGround, time, starTimer = 0) => {
        if (starTimer > 0) {
          const hue = (time * 3.5) % 1;
          shirtMat.emissive.setHSL(hue, 0.9, 0.35);
          capMat.emissive.setHSL((hue + 0.3) % 1, 0.9, 0.35);
          overallMat.emissive.setHSL((hue + 0.6) % 1, 0.9, 0.35);
        } else {
          shirtMat.emissive.setHex(0x000000);
          capMat.emissive.setHex(0x000000);
          overallMat.emissive.setHex(0x000000);
        }

        if (Math.abs(vx) > 0.05) {
          const targetRotY = vx > 0 ? Math.PI / 2 : -Math.PI / 2;
          model.rotation.y += (targetRotY - model.rotation.y) * 0.28;
        }

        if (!onGround) {
          rightArm.rotation.x = -Math.PI * 0.82;
          leftArm.rotation.x = Math.PI * 0.35;
          leftLeg.rotation.x = -Math.PI * 0.35;
          rightLeg.rotation.x = Math.PI * 0.42;
          torsoGroup.position.y = 0.65;
          torsoGroup.rotation.x = -0.12;
        } else if (Math.abs(vx) > 0.2) {
          const speed = Math.min(22, Math.abs(vx) * 2.4);
          const phase = time * speed;
          const swing = Math.sin(phase) * 0.85;
          leftLeg.rotation.x = swing;
          rightLeg.rotation.x = -swing;
          leftArm.rotation.x = -swing * 0.95;
          rightArm.rotation.x = swing * 0.95;
          torsoGroup.position.y = 0.62 + Math.abs(Math.cos(phase)) * 0.055;
          torsoGroup.rotation.x = 0.14;
        } else {
          const breath = Math.sin(time * 4) * 0.02;
          leftLeg.rotation.x *= 0.8;
          rightLeg.rotation.x *= 0.8;
          leftArm.rotation.x = breath;
          rightArm.rotation.x = -breath;
          torsoGroup.position.y = 0.62 + breath * 0.5;
          torsoGroup.rotation.x = 0;
        }
      }
    };

    rig.setForm('small');
    return rig;
  }

  createGoomba() {
    const root = new THREE.Group();
    const body = new THREE.Group();
    root.add(body);

    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.42, 22, 18), this.materials.goombaCap);
    cap.scale.set(1.08, 0.88, 1.05);
    cap.position.y = 0.54;
    cap.castShadow = true;
    body.add(cap);

    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.30, 18), this.materials.goombaStem);
    stem.position.y = 0.24;
    stem.castShadow = true;
    body.add(stem);

    [-0.13, 0.13].forEach(ex => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 12), this.materials.marioWhite);
      eye.scale.set(0.8, 1.25, 0.5);
      eye.position.set(ex, 0.52, 0.38);
      body.add(eye);

      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.042, 10, 10), this.materials.black);
      pupil.position.set(ex * 0.88, 0.51, 0.41);
      body.add(pupil);

      const brow = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.04, 0.04), this.materials.black);
      brow.position.set(ex, 0.63, 0.39);
      brow.rotation.z = ex < 0 ? -0.38 : 0.38;
      body.add(brow);

      const fang = new THREE.Mesh(new THREE.ConeGeometry(0.038, 0.09, 10), this.materials.marioWhite);
      fang.position.set(ex * 0.9, 0.39, 0.39);
      body.add(fang);
    });

    const leftFoot = new THREE.Mesh(new THREE.SphereGeometry(0.14, 14, 12), this.materials.black);
    leftFoot.scale.set(0.95, 0.62, 1.35);
    leftFoot.position.set(-0.16, 0.09, 0.05);
    leftFoot.castShadow = true;
    body.add(leftFoot);

    const rightFoot = new THREE.Mesh(new THREE.SphereGeometry(0.14, 14, 12), this.materials.black);
    rightFoot.scale.set(0.95, 0.62, 1.35);
    rightFoot.position.set(0.16, 0.09, 0.05);
    rightFoot.castShadow = true;
    body.add(rightFoot);

    return {
      root,
      body,
      leftFoot,
      rightFoot,
      animate: (time) => {
        const waddle = Math.sin(time * 11);
        leftFoot.position.z = 0.05 + waddle * 0.11;
        leftFoot.position.y = 0.09 + Math.max(0, waddle) * 0.05;
        rightFoot.position.z = 0.05 - waddle * 0.11;
        rightFoot.position.y = 0.09 + Math.max(0, -waddle) * 0.05;
        body.rotation.z = waddle * 0.09;
      }
    };
  }

  createKoopa() {
    const root = new THREE.Group();
    const bodyGroup = new THREE.Group();
    root.add(bodyGroup);

    const shellGroup = new THREE.Group();
    shellGroup.position.y = 0.44;
    bodyGroup.add(shellGroup);

    const shellDome = new THREE.Mesh(new THREE.SphereGeometry(0.36, 20, 18), this.materials.koopaGreen);
    shellDome.scale.set(0.92, 1.05, 1.15);
    shellDome.castShadow = true;
    shellGroup.add(shellDome);

    const shellRim = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.045, 10, 20), this.materials.marioWhite);
    shellRim.rotation.x = Math.PI / 2;
    shellRim.scale.set(0.92, 1.15, 1);
    shellGroup.add(shellRim);

    const limbsGroup = new THREE.Group();
    bodyGroup.add(limbsGroup);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 18, 16), this.materials.koopaYellow);
    head.scale.set(0.9, 1.0, 1.25);
    head.position.set(0, 0.85, 0.28);
    head.castShadow = true;
    limbsGroup.add(head);

    [-0.07, 0.07].forEach(ex => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 10), this.materials.marioWhite);
      eye.position.set(ex, 0.92, 0.43);
      limbsGroup.add(eye);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), this.materials.black);
      pupil.position.set(ex, 0.92, 0.47);
      limbsGroup.add(pupil);
    });

    const leftBoot = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 12), this.materials.koopaYellow);
    leftBoot.scale.set(0.9, 0.65, 1.35);
    leftBoot.position.set(-0.16, 0.10, 0.08);
    limbsGroup.add(leftBoot);

    const rightBoot = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 12), this.materials.koopaYellow);
    rightBoot.scale.set(0.9, 0.65, 1.35);
    rightBoot.position.set(0.16, 0.10, 0.08);
    limbsGroup.add(rightBoot);

    bodyGroup.rotation.y = -Math.PI / 2;

    return {
      root,
      bodyGroup,
      shellGroup,
      limbsGroup,
      leftBoot,
      rightBoot,
      inShell: false,
      setShellMode: (inShell) => {
        limbsGroup.visible = !inShell;
        shellGroup.position.y = inShell ? 0.32 : 0.44;
        shellGroup.rotation.x = inShell ? Math.PI / 2 : 0;
      },
      animate: (vx, time, inShell) => {
        if (inShell) {
          if (Math.abs(vx) > 0.5) {
            shellGroup.rotation.z += vx * 0.08;
          }
        } else {
          bodyGroup.rotation.y = vx > 0 ? Math.PI / 2 : -Math.PI / 2;
          const step = Math.sin(time * 10);
          leftBoot.position.z = 0.08 + step * 0.12;
          rightBoot.position.z = 0.08 - step * 0.12;
        }
      }
    };
  }

  createPiranhaPlant() {
    const root = new THREE.Group();

    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.75, 14), this.materials.pipeGreen);
    stem.position.y = 0.36;
    root.add(stem);

    [-1, 1].forEach(side => {
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 10), this.materials.pipeGreen);
      leaf.scale.set(1.4, 0.25, 0.65);
      leaf.position.set(side * 0.22, 0.22, 0);
      leaf.rotation.z = side * 0.35;
      root.add(leaf);
    });

    const headPivot = new THREE.Group();
    headPivot.position.y = 0.78;
    root.add(headPivot);

    const createJaw = (isUpper) => {
      const jaw = new THREE.Group();
      const sign = isUpper ? 1 : -1;
      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.5),
        this.materials.marioRed
      );
      if (!isUpper) dome.rotation.x = Math.PI;
      jaw.add(dome);

      const spots = [[0, 0.22, 0.22], [-0.22, 0.18, 0.12], [0.22, 0.18, 0.12], [0, 0.24, -0.18]];
      spots.forEach(([sx, sy, sz]) => {
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.068, 10, 10), this.materials.marioWhite);
        dot.position.set(sx, sign * sy, sz);
        jaw.add(dot);
      });

      const lip = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.052, 10, 20), this.materials.marioWhite);
      lip.rotation.x = Math.PI / 2;
      jaw.add(lip);

      for (let t = -2; t <= 2; t++) {
        const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.042, 0.11, 8), this.materials.marioWhite);
        tooth.position.set(t * 0.11, sign * -0.04, 0.26);
        if (isUpper) tooth.rotation.x = Math.PI;
        jaw.add(tooth);
      }
      return jaw;
    };

    const upperJaw = createJaw(true);
    const lowerJaw = createJaw(false);
    headPivot.add(upperJaw);
    headPivot.add(lowerJaw);

    return {
      root,
      upperJaw,
      lowerJaw,
      animate: (time) => {
        const chomp = (Math.sin(time * 9) + 1) * 0.26;
        upperJaw.rotation.x = -0.35 - chomp;
        lowerJaw.rotation.x = 0.35 + chomp;
      }
    };
  }

  createBlock(type = 'brick') {
    const group = new THREE.Group();
    let mat = this.materials.brick;
    if (type === 'question') mat = this.materials.question;
    else if (type === 'empty') mat = this.materials.emptyBlock;
    else if (type === 'ground') mat = this.materials.ground;
    else if (type === 'hard') mat = this.materials.hardBlock;
    else if (type === 'undergroundBrick') mat = this.materials.undergroundBrick;

    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.98, 0.98), mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);

    if (type === 'hard') {
      const frame = new THREE.Mesh(new THREE.BoxGeometry(1.01, 0.82, 0.82), this.materials.emptyBlock);
      group.add(frame);
    }
    return group;
  }

  createPipe(height = 2) {
    const group = new THREE.Group();
    const shaftH = height - 0.45;
    const shaft = new THREE.Mesh(
      new THREE.CylinderGeometry(0.86, 0.86, shaftH, 28),
      this.materials.pipeGreen
    );
    shaft.position.y = shaftH / 2;
    shaft.castShadow = true;
    shaft.receiveShadow = true;
    group.add(shaft);

    const collar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.98, 0.98, 0.46, 28),
      this.materials.pipeGreen
    );
    collar.position.y = height - 0.23;
    collar.castShadow = true;
    collar.receiveShadow = true;
    group.add(collar);

    const hole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.76, 0.76, 0.08, 24),
      this.materials.pipeDark
    );
    hole.position.y = height - 0.02;
    group.add(hole);

    return group;
  }

  createCoin() {
    const group = new THREE.Group();
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.11, 24), this.materials.gold);
    disc.rotation.x = Math.PI / 2;
    disc.castShadow = true;
    group.add(disc);

    const slot = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.36, 0.14), this.materials.hardBlock);
    group.add(slot);
    return group;
  }

  createPowerUp(type = 'mushroom') {
    const group = new THREE.Group();
    if (type === 'mushroom' || type === 'oneup') {
      const capColor = type === 'oneup' ? 0x22c55e : 0xe11d48;
      const capMat = new THREE.MeshStandardMaterial({ color: capColor, roughness: 0.3 });
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.38, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.62), capMat);
      cap.position.y = 0.34;
      cap.castShadow = true;
      group.add(cap);

      [[0, 0.56, 0.22], [-0.26, 0.48, 0.12], [0.26, 0.48, 0.12], [0, 0.52, -0.24]].forEach(([sx, sy, sz]) => {
        const spot = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), this.materials.marioWhite);
        spot.position.set(sx, sy, sz);
        group.add(spot);
      });

      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.24, 0.32, 16), this.materials.skin);
      stem.position.y = 0.18;
      group.add(stem);
    } else if (type === 'flower') {
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.44, 10), this.materials.pipeGreen);
      stem.position.y = 0.22;
      group.add(stem);

      const outerRing = new THREE.Mesh(
        new THREE.TorusGeometry(0.24, 0.09, 12, 20),
        new THREE.MeshStandardMaterial({ color: 0xe11d48, emissive: 0x991b1b, emissiveIntensity: 0.4 })
      );
      outerRing.position.y = 0.52;
      group.add(outerRing);

      const innerRing = new THREE.Mesh(
        new THREE.TorusGeometry(0.14, 0.07, 12, 18),
        new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04, emissiveIntensity: 0.5 })
      );
      innerRing.position.y = 0.52;
      group.add(innerRing);

      const core = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), this.materials.marioWhite);
      core.position.y = 0.52;
      group.add(core);
    } else if (type === 'star') {
      const starMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.42, 0), this.materials.gold);
      starMesh.scale.set(1.1, 1.1, 0.45);
      starMesh.position.y = 0.45;
      starMesh.castShadow = true;
      group.add(starMesh);
    }
    return group;
  }

  createCloud(scale = 1) {
    const group = new THREE.Group();
    const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.65 });
    const puffs = [
      [0, 0, 0, 0.85],
      [-0.75, -0.12, 0.08, 0.65],
      [0.75, -0.12, 0.08, 0.65],
      [-0.38, 0.32, -0.05, 0.68],
      [0.38, 0.32, -0.05, 0.68]
    ];
    puffs.forEach(([px, py, pz, pr]) => {
      const m = new THREE.Mesh(new THREE.SphereGeometry(pr, 16, 16), cloudMat);
      m.position.set(px, py, pz);
      group.add(m);
    });
    [-0.22, 0.22].forEach(ex => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), this.materials.black);
      eye.scale.set(0.7, 1.4, 0.5);
      eye.position.set(ex, 0.08, 0.82);
      group.add(eye);
    });
    group.scale.setScalar(scale);
    return group;
  }

  createCastle() {
    const group = new THREE.Group();
    const keep1 = new THREE.Mesh(new THREE.BoxGeometry(5.2, 3.6, 4.2), this.materials.brick);
    keep1.position.y = 1.8;
    keep1.castShadow = true;
    keep1.receiveShadow = true;
    group.add(keep1);

    const keep2 = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.4, 2.8), this.materials.brick);
    keep2.position.y = 4.6;
    keep2.castShadow = true;
    group.add(keep2);

    for (let x = -2.2; x <= 2.2; x += 1.1) {
      const merlon = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.65, 0.65), this.materials.brick);
      merlon.position.set(x, 3.9, 1.8);
      group.add(merlon);
    }
    for (let x = -1.2; x <= 1.2; x += 0.8) {
      const merlon2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.5), this.materials.brick);
      merlon2.position.set(x, 6.05, 1.15);
      group.add(merlon2);
    }

    const doorBox = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.8, 0.25), this.materials.black);
    doorBox.position.set(0, 0.9, 2.05);
    group.add(doorBox);

    const doorArch = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 0.25, 20), this.materials.black);
    doorArch.rotation.x = Math.PI / 2;
    doorArch.position.set(0, 1.8, 2.05);
    group.add(doorArch);

    return group;
  }
}

// ============================================================================
// Super Mario 3D Bros - Interactive 360° 3D Model Turntable Inspector Studio

class ModelInspectorStudio {
  constructor(factory) {
    this.factory = factory;
    this.active = false;
    this.currentModelIndex = 0;
    this.models = [];
    this.initStudio();
  }

  initStudio() {
    this.canvas = document.getElementById('inspector-canvas');
    if (!this.canvas) return;

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x0f172a);

    this.camera = new THREE.PerspectiveCamera(36, 520 / 360, 0.1, 50);
    this.camera.position.set(0, 1.1, 3.3);

        title: '食人花 (Piranha Plant - 锯齿上下颚咬合模型)',

        obj: piranha.root,
        animate: (t) => piranha.animate(t)
      }
    ];

    this.selectEntry(0);
  }

  selectEntry(index) {
    this.currentModelIndex = (index + this.entries.length) % this.entries.length;
    while (this.turntable.children.length > 0) {
      this.turntable.remove(this.turntable.children[0]);
    }
    const entry = this.entries[this.currentModelIndex];
    this.turntable.add(entry.obj);

    const titleEl = document.getElementById('inspector-title');
    const descEl = document.getElementById('inspector-desc');
    if (titleEl) titleEl.textContent = entry.title;
    if (descEl) descEl.textContent = entry.desc;
  }

  toggle(show) {
    this.active = show !== undefined ? show : !this.active;
    const modal = document.getElementById('inspector-modal');
    if (modal) {
      modal.classList.toggle('hidden', !this.active);
    }
    if (this.active) {
      this.renderLoop();
    }
  }

  renderLoop() {
    if (!this.active) return;
    const t = performance.now() * 0.001;
    this.turntable.rotation.y = t * 0.95;
    const entry = this.entries[this.currentModelIndex];
    if (entry && entry.animate) entry.animate(t);
    this.renderer.render(this.scene, this.camera);
    requestAnimationFrame(() => this.renderLoop());
  }
}

window.ModelInspectorStudio = ModelInspectorStudio;

  initPlayer() {
    this.mario = this.factory.createMario();
    this.scene.add(this.mario.root);
    this.resetPlayerPosition(2.5, 2.0);
  }

  resetPlayerPosition(x, y) {
    this.player = {
      x,

    this.mario.root.rotation.set(0, 0, 0);
  }

  clearEntities() {
    [...this.blocks, ...this.pipes, ...this.enemies, ...this.items, ...this.fireballs, ...this.particles, ...this.scenery].forEach(obj => {
      if (obj.mesh) this.scene.remove(obj.mesh);
      if (obj.root) this.scene.remove(obj.root);
    });
    this.blocks = [];
    this.spatialGrid.clear();
    this.pipes = [];
    this.enemies = [];
    this.items = [];
    this.fireballs = [];
    this.particles = [];
    this.scenery = [];
  }

  addBlock(x, y, type = 'brick', content = null) {
    const mesh = this.factory.createBlock(type);
    mesh.position.set(x, y + 0.5, 0);
    this.scene.add(mesh);
    const block = { x, y, baseY: y + 0.5, type, content, bumpOffset: 0, bumpVel: 0, mesh };
    this.blocks.push(block);
    const key = `${Math.round(x)},${Math.round(y)}`;
    this.spatialGrid.set(key, block);
    return block;
  }

  removeBlock(block) {
    this.scene.remove(block.mesh);
    const key = `${Math.round(block.x)},${Math.round(block.y)}`;
    this.spatialGrid.delete(key);
    const idx = this.blocks.indexOf(block);
    if (idx !== -1) this.blocks.splice(idx, 1);

  addPipe(x, y, height = 2, hasPiranha = false, warpTarget = null) {

      y,
      width: 1.72,

      warpTarget

    for (let x = 0; x <= 24; x++) {
      this.addBlock(x, 0, 'undergroundBrick');
      this.addBlock(x, -1, 'undergroundBrick');
      if (x >= 4 && x <= 20) {
        this.addBlock(x, 10, 'undergroundBrick');

    for (let y = 1; y <= 10; y++) {
      this.addBlock(0, y, 'undergroundBrick');

  spawnBrickShatter(x, y) {
    this.audio.playBreakBlock();
    const dirs = [

      [-2.2, 11.0], [2.2, 11.0], [-5.2, 4.5], [5.2, 4.5]
