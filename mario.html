      const shard = new THREE.Mesh(
        new THREE.BoxGeometry(0.32, 0.32, 0.32),
        this.inUnderground ? this.factory.materials.undergroundBrick : this.factory.materials.brick
      );
      shard.position.set(x, y + 0.5, (Math.random() - 0.5) * 0.4);
      shard.castShadow = true;
      this.scene.add(shard);
      this.particles.push({
        mesh: shard,
        vx, vy, vz: (Math.random() - 0.5) * 3,
        rotSpeed: (Math.random() - 0.5) * 14,
        life: 1.4
      });
    });
  }

  spawnCoinBurst(x, y) {
    this.audio.playCoin();
    this.coins++;
    this.score += 200;
    if (this.coins >= 100) {
      this.coins -= 100;
      this.lives++;
      this.audio.playOneUp();
    }
    const coinMesh = this.factory.createCoin();
    coinMesh.position.set(x, y + 1.0, 0);
    this.scene.add(coinMesh);
    this.particles.push({
      mesh: coinMesh,
      vx: 0, vy: 9.5, vz: 0,
      rotSpeed: 18,
      life: 0.55
    });
    this.spawnFloatingText(x, y + 1.4, '+200', '#facc15');
    this.updateHUD();
  }

  spawnFireworkBurst(x, y, z) {
    this.audio.playFirework();
    const colors = [0xef4444, 0xfacc15, 0x38bdf8, 0x4ade80, 0xf472b6];
    const color = colors[Math.floor(Math.random() * colors.length)];
    const mat = new THREE.MeshBasicMaterial({ color });
    for (let i = 0; i < 24; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI;
      const speed = 4 + Math.random() * 5;
      const spark = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), mat);
      spark.position.set(x, y, z);
      this.scene.add(spark);
      this.particles.push({
        mesh: spark,
        vx: Math.sin(phi) * Math.cos(theta) * speed,
        vy: Math.cos(phi) * speed + 2,
        vz: Math.sin(phi) * Math.sin(theta) * speed,
        rotSpeed: 0,
        life: 0.95
      });
    }
  }

  spawnFloatingText(x, y, text, color = '#ffffff') {
    const div = document.createElement('div');
    div.className = 'floating-score';
    div.style.color = color;
    div.textContent = text;
    document.body.appendChild(div);
    this.floatingTexts.push({ el: div, x, y, life: 0.95 });
  }

  triggerBlockHit(block) {
    if (block.type === 'empty' || block.type === 'hard' || block.type === 'ground') {
      this.audio.playBump();
      return;
    }

    block.bumpVel = 4.2;

    this.enemies.forEach(en => {
      if (!en.dead && Math.abs(en.x - block.x) < 0.85 && Math.abs(en.y - (block.y + 1)) < 0.4) {
        en.dead = true;
        en.vy = 7.5;
        this.score += 100;
        this.audio.playKick();
        this.spawnFloatingText(en.x, en.y + 0.8, '+100', '#facc15');
      }
    });

    if (block.type === 'question') {
      block.type = 'empty';
      block.mesh.children[0].material = this.factory.materials.emptyBlock;

      if (block.content === 'coin') {
        this.spawnCoinBurst(block.x, block.y);
      } else if (block.content === 'powerup') {
        this.audio.playPowerUpAppear();
        const itemType = this.mario.form === 'small' ? 'mushroom' : 'flower';
        const mesh = this.factory.createPowerUp(itemType);
        mesh.position.set(block.x, block.y + 1.05, 0);
        this.scene.add(mesh);
        this.items.push({
          type: itemType,
          x: block.x,
          y: block.y + 1.05,
          vx: itemType === 'flower' ? 0 : 2.5,
          vy: 2.2,
          mesh
        });
      } else if (block.content === 'oneup') {
        this.audio.playPowerUpAppear();
        const mesh = this.factory.createPowerUp('oneup');
        mesh.position.set(block.x, block.y + 1.05, 0);
        this.scene.add(mesh);
        this.items.push({
          type: 'oneup',
          x: block.x,
          y: block.y + 1.05,
          vx: 2.8,
          vy: 2.2,
          mesh
        });
      } else if (block.content === 'star') {
        this.audio.playPowerUpAppear();
        const mesh = this.factory.createPowerUp('star');
        mesh.position.set(block.x, block.y + 1.05, 0);
        this.scene.add(mesh);
        this.items.push({
          type: 'star',
          x: block.x,
          y: block.y + 1.05,
          vx: 3.4,
          vy: 6.5,
          mesh
        });
      }
    } else if (block.type === 'brick') {
      if (this.mario.form !== 'small') {
        this.removeBlock(block);
        this.spawnBrickShatter(block.x, block.y);
        this.score += 50;
        this.updateHUD();
      } else {
        this.audio.playBump();
      }
    }
  }

  shootFireball() {
    if (this.mario.form !== 'fire' || this.fireCooldown > 0 || this.player.dead) return;
    this.fireCooldown = 0.28;
    this.audio.playFireball();

    const dir = this.mario.model.rotation.y > 0 ? 1 : -1;
    const fbGroup = new THREE.Group();
    const core = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 14, 14),
      new THREE.MeshBasicMaterial({ color: 0xfacc15 })
    );
    const aura = new THREE.Mesh(
      new THREE.SphereGeometry(0.32, 14, 14),
      new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.65 })
    );
    const light = new THREE.PointLight(0xf97316, 1.4, 5);
    fbGroup.add(core, aura, light);

    const fx = this.player.x + dir * 0.55;
    const fy = this.player.y + 0.85;
    fbGroup.position.set(fx, fy, 0);
    this.scene.add(fbGroup);

    this.fireballs.push({
      x: fx,
      y: fy,
      vx: dir * 13.5,
      vy: -3.5,
      mesh: fbGroup,
      life: 2.5
    });
  }

  getSolidCollidersNear(x, y) {
    const list = [];
    const minX = Math.floor(x - 2);
    const maxX = Math.ceil(x + 2);
    const minY = Math.floor(y - 2);
    const maxY = Math.ceil(y + 3);

    for (let gx = minX; gx <= maxX; gx++) {
      for (let gy = minY; gy <= maxY; gy++) {
        const b = this.spatialGrid.get(`${gx},${gy}`);
        if (b) {
          list.push({ x: b.x, y: b.y, w: 1.0, h: 1.0, block: b });
        }
      }
    }
    this.pipes.forEach(p => {
      if (Math.abs(p.x - x) < 3.0) {
        list.push({ x: p.x, y: p.y, w: p.width, h: p.height, pipe: p });
      }
    });
    return list;
  }

  overlapAABB(ax, ay, aw, ah, bx, by, bw, bh) {
    return (
      Math.abs(ax - bx) < (aw + bw) * 0.5 &&
      ay < by + bh &&
      ay + ah > by
    );
  }

  updatePlayer(dt, time) {
    const p = this.player;
    if (p.dead) {
      p.vy -= 26 * dt;
      p.y += p.vy * dt;
      this.mario.root.position.set(p.x, p.y, 0);
      this.mario.root.rotation.z += 9 * dt;
      return;
    }

    if (p.flagSlide) {
      if (p.y > 2.0) {
        p.y -= 6.5 * dt;
        this.flagMesh.position.y = Math.max(1.8, p.y);
        this.mario.root.position.set(this.flagpoleX - 0.35, p.y, 0);
      } else if (!p.walkingToCastle) {
        p.walkingToCastle = true;
        this.audio.playStageClear();
      } else {
        if (p.x < this.castleX) {
          p.x += 4.2 * dt;
          this.mario.root.position.set(p.x, 1.0, 0);
          this.mario.animate(4.2, 0, true, time, 0);
        } else {
          this.mario.root.visible = false;
          if (Math.random() < 0.06) {
            this.spawnFireworkBurst(
              this.castleX + (Math.random() - 0.5) * 8,
              6 + Math.random() * 4,
              -1 + (Math.random() - 0.5) * 2
            );
          }
        }
      }
      return;
    }

    if (p.invincibleTimer > 0) {
      p.invincibleTimer -= dt;
      this.mario.root.visible = Math.floor(p.invincibleTimer * 16) % 2 === 0;
    } else {
      this.mario.root.visible = true;
    }

    if (p.starTimer > 0) {
      p.starTimer -= dt;
      if (p.starTimer <= 0) {
        this.audio.startBGM(this.inUnderground ? 'underground' : 'overworld');
      }
    }

    if (this.fireCooldown > 0) this.fireCooldown -= dt;
    if (this.keys.fire) this.shootFireball();

    const maxSpeed = this.keys.run ? 9.8 : 6.6;
    const accel = p.onGround ? 34.0 : 20.0;
    const friction = p.onGround ? 24.0 : 6.0;

    if (this.keys.left) {
      p.vx = Math.max(-maxSpeed, p.vx - accel * dt);
    } else if (this.keys.right) {
      p.vx = Math.min(maxSpeed, p.vx + accel * dt);
    } else {
      if (p.vx > 0) p.vx = Math.max(0, p.vx - friction * dt);
      if (p.vx < 0) p.vx = Math.min(0, p.vx + friction * dt);
    }

    if (this.keys.up && p.onGround) {
      p.vy = 13.8 + Math.abs(p.vx) * 0.18;
      p.onGround = false;
      this.audio.playJump(this.mario.form !== 'small');
      this.keys.up = false;
    }

    const gravity = p.vy > 0 && this.keys.upHeld ? 24.5 : 36.0;
    p.vy = Math.max(-22, p.vy - gravity * dt);

    p.x += p.vx * dt;
    const collidersX = this.getSolidCollidersNear(p.x, p.y);
    for (const c of collidersX) {
      if (this.overlapAABB(p.x, p.y + 0.05, p.width, p.height - 0.1, c.x, c.y, c.w, c.h)) {
        if (p.vx > 0) p.x = c.x - (c.w + p.width) * 0.5;
        else if (p.vx < 0) p.x = c.x + (c.w + p.width) * 0.5;
        p.vx = 0;
      }
    }

    p.y += p.vy * dt;
    p.onGround = false;
    const collidersY = this.getSolidCollidersNear(p.x, p.y);
    for (const c of collidersY) {
      if (this.overlapAABB(p.x, p.y, p.width * 0.9, p.height, c.x, c.y, c.w, c.h)) {
        if (p.vy <= 0 && p.y - p.vy * dt >= c.y + c.h - 0.25) {
          p.y = c.y + c.h;
          p.vy = 0;
          p.onGround = true;

          if (c.pipe && c.pipe.warpTarget && this.keys.down) {
            if (c.pipe.warpTarget === 'underground') {
              this.enterUnderground();
              return;
            } else if (c.pipe.warpTarget === 'overworldExit') {
              this.exitUnderground();
              return;
            }
          }
        } else if (p.vy > 0 && p.y + p.height - p.vy * dt <= c.y + 0.3) {
          p.y = c.y - p.height;
          p.vy = -1.5;
          if (c.block) this.triggerBlockHit(c.block);
        }
      }
    }

    if (p.y < -3.5) {
      this.killPlayer();
      return;
    }

    if (!this.inUnderground && !this.isStageClear && p.x >= this.flagpoleX - 0.45) {
      this.isStageClear = true;
      p.flagSlide = true;
      p.vx = 0;
      const heightBonus = Math.min(5000, Math.max(100, Math.round(p.y * 500)));
      this.score += heightBonus;
      this.audio.playFlagpole();
      this.spawnFloatingText(this.flagpoleX, p.y + 1, `+${heightBonus} FLAG!`, '#4ade80');
      this.updateHUD();
      document.getElementById('victory-banner').classList.remove('hidden');
    }

    this.mario.root.position.set(p.x, p.y, 0);
    this.mario.animate(p.vx, p.vy, p.onGround, time, p.starTimer);
  }

  takeDamage() {
    if (this.player.invincibleTimer > 0 || this.player.starTimer > 0 || this.player.dead) return;
    if (this.mario.form === 'fire') {
      this.mario.setForm('super');
      this.player.invincibleTimer = 2.0;
      this.audio.playPipeWarp();
      this.spawnFloatingText(this.player.x, this.player.y + 1.5, 'POWER DOWN', '#fb923c');
    } else if (this.mario.form === 'super') {
      this.mario.setForm('small');
      this.player.height = 0.95;
      this.player.invincibleTimer = 2.0;
      this.audio.playPipeWarp();
      this.spawnFloatingText(this.player.x, this.player.y + 1.2, 'SMALL MARIO', '#fb923c');
    } else {
      this.killPlayer();
    }
    this.updateHUD();
  }

  killPlayer() {
    if (this.player.dead) return;
    this.player.dead = true;
    this.player.vy = 11.5;
    this.lives--;
    this.audio.playDeath();
    this.updateHUD();

    setTimeout(() => {
      if (this.lives <= 0) {
        this.lives = 3;
        this.score = 0;
        this.coins = 0;
      }
      this.mario.setForm('small');
      this.buildLevel();
      this.resetPlayerPosition(2.5, 2.0);
      this.audio.startBGM('overworld');
    }, 2600);
  }

  updateEntities(dt, time) {
    this.blocks.forEach(b => {
      if (b.bumpOffset > 0 || b.bumpVel !== 0) {
        b.bumpOffset += b.bumpVel * dt;
        b.bumpVel -= 28 * dt;
        if (b.bumpOffset <= 0) {
          b.bumpOffset = 0;
          b.bumpVel = 0;
        }
        b.mesh.position.y = b.baseY + b.bumpOffset;
      }
    });

    this.pipes.forEach(pipe => {
      if (pipe.piranha) {
        pipe.piranha.animate(time);
        const distMario = Math.abs(this.player.x - pipe.x);
        pipe.piranhaTimer += dt;
        const cycle = pipe.piranhaTimer % 4.4;
        let targetOffset = 0;
        if (cycle < 1.8 && distMario > 1.7) {
          targetOffset = 1.05;
        }
        pipe.piranhaOffset += (targetOffset - pipe.piranhaOffset) * 5 * dt;
        pipe.piranha.root.position.y = pipe.y + pipe.height - 0.9 + pipe.piranhaOffset;

        if (pipe.piranhaOffset > 0.45 && !this.player.dead) {
          if (this.overlapAABB(this.player.x, this.player.y, this.player.width, this.player.height, pipe.x, pipe.y + pipe.height, 0.7, 0.85)) {
            if (this.player.starTimer > 0) {
              this.scene.remove(pipe.piranha.root);
              pipe.piranha = null;
              this.score += 200;
              this.audio.playKick();
            } else {
              this.takeDamage();
            }
          }
        }
      }
    });

    for (let i = this.items.length - 1; i >= 0; i--) {
      const item = this.items[i];
      item.mesh.rotation.y += 2.6 * dt;

      if (item.type !== 'staticCoin' && item.type !== 'flower') {
        item.vy = Math.max(-15, item.vy - 24 * dt);
        item.x += item.vx * dt;
        item.y += item.vy * dt;

        const cols = this.getSolidCollidersNear(item.x, item.y);
        for (const c of cols) {
          if (this.overlapAABB(item.x, item.y, 0.7, 0.7, c.x, c.y, c.w, c.h)) {
            if (item.vy <= 0 && item.y - item.vy * dt >= c.y + c.h - 0.25) {
              item.y = c.y + c.h;
              item.vy = item.type === 'star' ? 8.5 : 0;
            } else {
              item.vx = -item.vx;
            }
          }
        }
        item.mesh.position.set(item.x, item.y, 0);
      }

      if (!this.player.dead && this.overlapAABB(this.player.x, this.player.y, this.player.width, this.player.height, item.x, item.y, 0.75, 0.75)) {
        this.scene.remove(item.mesh);
        this.items.splice(i, 1);

        if (item.type === 'staticCoin') {
          this.audio.playCoin();
          this.coins++;
          this.score += 200;
          this.spawnFloatingText(item.x, item.y + 0.6, '+200', '#facc15');
        } else if (item.type === 'mushroom') {
          this.audio.playPowerUpCollect();
          this.mario.setForm('super');
          this.player.height = 1.55;
          this.score += 1000;
          this.spawnFloatingText(item.x, item.y + 1.0, 'SUPER MARIO! +1000', '#4ade80');
        } else if (item.type === 'flower') {
          this.audio.playPowerUpCollect();
          this.mario.setForm('fire');
          this.player.height = 1.55;
          this.score += 1000;
          this.spawnFloatingText(item.x, item.y + 1.0, 'FIRE MARIO! [J/X]', '#f97316');
        } else if (item.type === 'oneup') {
          this.audio.playOneUp();
          this.lives++;
          this.spawnFloatingText(item.x, item.y + 1.0, '1-UP!', '#22c55e');
        } else if (item.type === 'star') {
          this.audio.playPowerUpCollect();
          this.player.starTimer = 11.0;
          this.score += 1000;
          this.audio.startBGM('star');
          this.spawnFloatingText(item.x, item.y + 1.0, 'STAR INVINCIBLE!', '#facc15');
        }
        this.updateHUD();
      }
    }

    for (let i = this.fireballs.length - 1; i >= 0; i--) {
      const fb = this.fireballs[i];
      fb.life -= dt;
      fb.vy -= 28 * dt;
      fb.x += fb.vx * dt;
      fb.y += fb.vy * dt;
      fb.mesh.position.set(fb.x, fb.y, 0);

      let removeFb = fb.life <= 0;
      const cols = this.getSolidCollidersNear(fb.x, fb.y);
      for (const c of cols) {
        if (this.overlapAABB(fb.x, fb.y, 0.35, 0.35, c.x, c.y, c.w, c.h)) {
          if (fb.vy < 0 && fb.y - fb.vy * dt >= c.y + c.h - 0.25) {
            fb.y = c.y + c.h;
            fb.vy = 6.8;
          } else {
            removeFb = true;
          }
        }
      }

      for (const en of this.enemies) {
        if (!en.dead && !en.squished && this.overlapAABB(fb.x, fb.y, 0.4, 0.4, en.x, en.y, en.width, en.height)) {
          en.dead = true;
          en.vy = 7.5;
          this.score += 200;
          this.audio.playKick();
          this.spawnFloatingText(en.x, en.y + 0.8, '+200 FIRE!', '#f97316');
          this.updateHUD();
          removeFb = true;
          break;
        }
      }

      if (removeFb) {
        this.scene.remove(fb.mesh);
        this.fireballs.splice(i, 1);
      }
    }

    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const en = this.enemies[i];
      if (Math.abs(en.x - this.player.x) > 28 && !en.shellMoving) continue;

      if (en.dead) {
        en.vy -= 25 * dt;
        en.y += en.vy * dt;
        en.mesh.position.set(en.x, en.y, 0);
        en.mesh.rotation.x += 8 * dt;
        if (en.y < -5) {
          this.scene.remove(en.mesh);
          this.enemies.splice(i, 1);
        }
        continue;
      }

      if (en.squished) {
        en.squishTimer -= dt;
        if (en.squishTimer <= 0) {
          this.scene.remove(en.mesh);
          this.enemies.splice(i, 1);
        }
        continue;
      }

      en.vy = Math.max(-18, en.vy - 28 * dt);
      en.x += en.vx * dt;
      en.y += en.vy * dt;

      const cols = this.getSolidCollidersNear(en.x, en.y);
      for (const c of cols) {
        if (this.overlapAABB(en.x, en.y, en.width, en.height, c.x, c.y, c.w, c.h)) {
          if (en.vy <= 0 && en.y - en.vy * dt >= c.y + c.h - 0.25) {
            en.y = c.y + c.h;
            en.vy = 0;
          } else {
            en.vx = -en.vx;
            en.x += en.vx * dt * 2;
            if (en.shellMoving) this.audio.playBump();
          }
        }
      }

      en.mesh.position.set(en.x, en.y, 0);
      if (en.type === 'goomba') en.rig.animate(time);
      else if (en.type === 'koopa') en.rig.animate(en.vx, time, en.inShell);

      if (en.inShell && en.shellMoving) {
        this.enemies.forEach(other => {
          if (other !== en && !other.dead && !other.squished) {
            if (this.overlapAABB(en.x, en.y, en.width, en.height, other.x, other.y, other.width, other.height)) {
              other.dead = true;
              other.vy = 8.0;
              this.score += 500;
              this.audio.playKick();
              this.spawnFloatingText(other.x, other.y + 0.8, '+500 SHELL COMBO!', '#38bdf8');
              this.updateHUD();
            }
          }
        });
      }

      if (!this.player.dead && this.overlapAABB(this.player.x, this.player.y, this.player.width, this.player.height, en.x, en.y, en.width, en.height)) {
        if (this.player.starTimer > 0) {
          en.dead = true;
          en.vy = 8.5;
          this.score += 200;
          this.audio.playKick();
          this.spawnFloatingText(en.x, en.y + 0.8, '+200 STAR!', '#facc15');
          this.updateHUD();
        } else if (this.player.vy < -0.5 && this.player.y > en.y + en.height * 0.42) {
          this.player.vy = 9.8;
          this.audio.playStomp();
          this.score += 200;
          this.updateHUD();

          if (en.type === 'goomba') {
            en.squished = true;
            en.squishTimer = 0.65;
            en.mesh.scale.set(1.25, 0.25, 1.25);
            this.spawnFloatingText(en.x, en.y + 0.7, '+200 STOMP!', '#ffffff');
          } else if (en.type === 'koopa') {
            if (!en.inShell) {
              en.inShell = true;
              en.shellMoving = false;
              en.vx = 0;
              en.height = 0.68;
              en.rig.setShellMode(true);
              this.spawnFloatingText(en.x, en.y + 0.7, 'SHELL!', '#4ade80');
            } else if (!en.shellMoving) {
              en.shellMoving = true;
              en.vx = this.player.x < en.x ? 12.5 : -12.5;
              this.audio.playKick();
              this.spawnFloatingText(en.x, en.y + 0.7, 'KICK! +400', '#38bdf8');
            } else {
              en.shellMoving = false;
              en.vx = 0;
            }
          }
        } else if (en.inShell && !en.shellMoving) {
          en.shellMoving = true;
          en.vx = this.player.x < en.x ? 12.5 : -12.5;
          this.audio.playKick();
          this.score += 400;
          this.spawnFloatingText(en.x, en.y + 0.7, 'KICK!', '#38bdf8');
        } else {
          this.takeDamage();
        }
      }
    }

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.life -= dt;
      pt.vy -= 24 * dt;
      pt.mesh.position.x += pt.vx * dt;
      pt.mesh.position.y += pt.vy * dt;
      pt.mesh.position.z += pt.vz * dt;
      pt.mesh.rotation.x += pt.rotSpeed * dt;
      pt.mesh.rotation.y += pt.rotSpeed * dt;
      if (pt.life <= 0) {
        this.scene.remove(pt.mesh);
        this.particles.splice(i, 1);
      }
    }

    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const ft = this.floatingTexts[i];
      ft.life -= dt;
      ft.y += 1.6 * dt;
      const vec = new THREE.Vector3(ft.x, ft.y, 0);
      vec.project(this.camera);
      const sx = (vec.x * 0.5 + 0.5) * window.innerWidth;
      const sy = (-vec.y * 0.5 + 0.5) * window.innerHeight;
      ft.el.style.left = `${sx}px`;
      ft.el.style.top = `${sy}px`;
      ft.el.style.opacity = Math.min(1, ft.life * 1.5);
      if (ft.life <= 0) {
        ft.el.remove();
        this.floatingTexts.splice(i, 1);
      }
    }
  }

  cycleCameraMode() {
    this.cameraMode = (this.cameraMode + 1) % 3;
    const names = ['2.5D视角', '3D斜视角', '特写视角'];
    const btn = document.getElementById('btn-camera');
    if (btn) btn.textContent = `🎥 ${names[this.cameraMode]} [C]`;
  }

  updateCamera(dt, time) {
    const px = this.player.x;
    const py = Math.max(2.5, this.player.y);

    let targetPos = new THREE.Vector3();
    let lookTarget = new THREE.Vector3();

    if (this.cameraMode === 0) {
      targetPos.set(px + 2.8, py + 2.6, 15.8);
      lookTarget.set(px + 2.8, py + 1.8, 0);
    } else if (this.cameraMode === 1) {
      targetPos.set(px - 4.5, py + 4.2, 12.5);
      lookTarget.set(px + 3.5, py + 1.5, 0);
    } else {
      targetPos.set(px + Math.sin(time * 0.6) * 2.4, this.player.y + 1.5, 5.2);
      lookTarget.set(px, this.player.y + 0.85, 0);
    }

    this.camera.position.lerp(targetPos, 6.5 * dt);
    if (!this.currentLookAt) this.currentLookAt = lookTarget.clone();
    this.currentLookAt.lerp(lookTarget, 8.0 * dt);
    this.camera.lookAt(this.currentLookAt);

    this.dirLight.position.set(px + 14, 26, 18);
    this.dirLight.target.position.set(px, 0, 0);
  }

  updateHUD() {
    const elScore = document.getElementById('hud-score');
    const elCoins = document.getElementById('hud-coins');
    const elWorld = document.getElementById('hud-world');
    const elTime = document.getElementById('hud-time');
    const elLives = document.getElementById('hud-lives');
    const elForm = document.getElementById('hud-form');

    if (elScore) elScore.textContent = String(this.score).padStart(6, '0');
    if (elCoins) elCoins.textContent = `🪙 x${String(this.coins).padStart(2, '0')}`;
    if (elWorld) elWorld.textContent = this.worldName;
    if (elTime) elTime.textContent = String(Math.max(0, Math.floor(this.timeLeft))).padStart(3, '0');
    if (elLives) elLives.textContent = `❤️ x${this.lives}`;
    if (elForm) {
      const map = { small: '小马里奥', super: '超级马里奥', fire: '火焰马里奥' };
      elForm.textContent = this.player.starTimer > 0 ? '⭐ 无敌星' : map[this.mario.form];
    }
  }

  bindEvents() {
    window.addEventListener('resize', () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      this.audio.init();
      if (!this.audio.bgmPlaying && !this.isStageClear && !this.player.dead) {
        this.audio.startBGM(this.inUnderground ? 'underground' : 'overworld');
      }

      if (e.code === 'KeyA' || e.code === 'ArrowLeft') this.keys.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') this.keys.right = true;
      if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') {
        if (!this.keys.upHeld) this.keys.up = true;
        this.keys.upHeld = true;
      }
      if (e.code === 'KeyS' || e.code === 'ArrowDown') this.keys.down = true;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') this.keys.run = true;
      if (e.code === 'KeyJ' || e.code === 'KeyX') this.keys.fire = true;
      if (e.code === 'KeyC') this.cycleCameraMode();
      if (e.code === 'KeyM') {
        const muted = this.audio.toggleMute();
        const btn = document.getElementById('btn-audio');
        if (btn) btn.textContent = muted ? '🔇 关 [M]' : '🔊 开 [M]';
      }
      if (e.code === 'Digit1') { this.mario.setForm('small'); this.player.height = 0.95; this.updateHUD(); }
      if (e.code === 'Digit2') { this.mario.setForm('super'); this.player.height = 1.55; this.updateHUD(); }
      if (e.code === 'Digit3') { this.mario.setForm('fire'); this.player.height = 1.55; this.updateHUD(); }
    });

    window.addEventListener('keyup', e => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') this.keys.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') this.keys.right = false;
      if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') {
        this.keys.up = false;
        this.keys.upHeld = false;
      }
      if (e.code === 'KeyS' || e.code === 'ArrowDown') this.keys.down = false;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') this.keys.run = false;
      if (e.code === 'KeyJ' || e.code === 'KeyX') this.keys.fire = false;
    });

    this.bindTouchControls();
  }

  cycleForm() {
    if (this.mario.form === 'small') {
      this.mario.setForm('super');
      this.player.height = 1.55;
      this.audio.playPowerUp();
    } else if (this.mario.form === 'super') {
      this.mario.setForm('fire');
      this.player.height = 1.55;
      this.audio.playPowerUp();
    } else {
      this.mario.setForm('small');
      this.player.height = 0.95;
      this.audio.playPipe();
    }
    this.updateHUD();
  }

  toggleTouchControls() {
    const ctrl = document.getElementById('touch-controls');
    if (!ctrl) return;
    ctrl.classList.toggle('hidden');
  }

  bindTouchControls() {
    const controlsContainer = document.getElementById('touch-controls');
    if (!controlsContainer) return;

    const unlockAudio = () => {
      this.audio.init();
      if (!this.audio.bgmPlaying && !this.isStageClear && !this.player.dead) {
        this.audio.startBGM(this.inUnderground ? 'underground' : 'overworld');
      }
    };

    // Global touchstart on canvas unlocks audio on iOS Safari
    const container = document.getElementById('game-canvas-container');
    if (container) {
      container.addEventListener('touchstart', unlockAudio, { passive: true, once: true });
    }

    // ---- D-PAD Continuous Vector & Swipe Tracking ----
    const dpad = document.getElementById('touch-dpad');
    const btnUp = document.getElementById('btn-touch-up');
    const btnDown = document.getElementById('btn-touch-down');
    const btnLeft = document.getElementById('btn-touch-left');
    const btnRight = document.getElementById('btn-touch-right');

    const updateDpadTouch = (e) => {
      e.preventDefault();
      unlockAudio();
      const rect = dpad.getBoundingClientRect();
      const cx = rect.left + rect.width * 0.5;
      const cy = rect.top + rect.height * 0.5;

      let touch = null;
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        if (t.clientX >= rect.left - 25 && t.clientX <= rect.right + 25 &&
            t.clientY >= rect.top - 25 && t.clientY <= rect.bottom + 25) {
          touch = t;
          break;
        }
      }
      if (!touch) return;

      const dx = touch.clientX - cx;
      const dy = touch.clientY - cy;
      const deadzone = 12;

      // Left / Right
      if (dx < -deadzone) {
        this.keys.left = true;
        this.keys.right = false;
        btnLeft?.classList.add('active');
        btnRight?.classList.remove('active');
      } else if (dx > deadzone) {
        this.keys.right = true;
        this.keys.left = false;
        btnRight?.classList.add('active');
        btnLeft?.classList.remove('active');
      } else {
        this.keys.left = false;
        this.keys.right = false;
        btnLeft?.classList.remove('active');
        btnRight?.classList.remove('active');
      }

      // Down (duck / pipe)
      if (dy > deadzone * 1.2) {
        this.keys.down = true;
        btnDown?.classList.add('active');
      } else {
        this.keys.down = false;
        btnDown?.classList.remove('active');
      }

      // Up (jump alternate)
      if (dy < -deadzone * 1.4) {
        if (!this.keys.upHeld) this.keys.up = true;
        this.keys.upHeld = true;
        btnUp?.classList.add('active');
      } else {
        btnUp?.classList.remove('active');
      }
    };

    const endDpadTouch = (e) => {
      const rect = dpad.getBoundingClientRect();
      let hasTouch = false;
      if (e.touches) {
        for (let i = 0; i < e.touches.length; i++) {
          const t = e.touches[i];
          if (t.clientX >= rect.left - 25 && t.clientX <= rect.right + 25 &&
              t.clientY >= rect.top - 25 && t.clientY <= rect.bottom + 25) {
            hasTouch = true;
            break;
          }
        }
      }
      if (!hasTouch) {
        this.keys.left = false;
        this.keys.right = false;
        this.keys.down = false;
        this.keys.up = false;
        this.keys.upHeld = false;
        btnLeft?.classList.remove('active');
        btnRight?.classList.remove('active');
        btnDown?.classList.remove('active');
        btnUp?.classList.remove('active');
      }
    };

    dpad.addEventListener('touchstart', updateDpadTouch, { passive: false });
    dpad.addEventListener('touchmove', updateDpadTouch, { passive: false });
    dpad.addEventListener('touchend', endDpadTouch, { passive: false });
    dpad.addEventListener('touchcancel', endDpadTouch, { passive: false });

    // Pointer fallback for testing
    const setupPointerButton = (btn, onStart, onEnd) => {
      if (!btn) return;
      btn.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse') {
          e.preventDefault();
          unlockAudio();
          btn.classList.add('active');
          onStart();
        }
      });
      const endFn = (e) => {
        if (e.pointerType === 'mouse') {
          btn.classList.remove('active');
          onEnd();
        }
      };
      btn.addEventListener('pointerup', endFn);
      btn.addEventListener('pointercancel', endFn);
      btn.addEventListener('pointerleave', endFn);
    };

    setupPointerButton(btnLeft, () => { this.keys.left = true; }, () => { this.keys.left = false; });
    setupPointerButton(btnRight, () => { this.keys.right = true; }, () => { this.keys.right = false; });
    setupPointerButton(btnDown, () => { this.keys.down = true; }, () => { this.keys.down = false; });
    setupPointerButton(btnUp, () => { if (!this.keys.upHeld) this.keys.up = true; this.keys.upHeld = true; }, () => { this.keys.up = false; this.keys.upHeld = false; });

    // ---- ACTION BUTTONS (Jump, Run, Fire) ----
    const bindAction = (id, onStart, onEnd) => {
      const btn = document.getElementById(id);
      if (!btn) return;

      const handleStart = (e) => {
        e.preventDefault();
        e.stopPropagation();
        unlockAudio();
        btn.classList.add('active');
        onStart();
      };
      const handleEnd = (e) => {
        e.preventDefault();
        e.stopPropagation();
        btn.classList.remove('active');
        onEnd();
      };

      btn.addEventListener('touchstart', handleStart, { passive: false });
      btn.addEventListener('touchend', handleEnd, { passive: false });
      btn.addEventListener('touchcancel', handleEnd, { passive: false });

      btn.addEventListener('mousedown', handleStart);
      btn.addEventListener('mouseup', handleEnd);
      btn.addEventListener('mouseleave', handleEnd);
    };

    // Jump (A)
    bindAction('btn-touch-jump', () => {
      if (!this.keys.upHeld) this.keys.up = true;
      this.keys.upHeld = true;
    }, () => {
      this.keys.up = false;
      this.keys.upHeld = false;
    });

    // Run / Dash (B)
    bindAction('btn-touch-run', () => {
      this.keys.run = true;
    }, () => {
      this.keys.run = false;
    });

    // Fireball (X)
    bindAction('btn-touch-fire', () => {
      this.keys.fire = true;
      this.shootFireball();
    }, () => {
      this.keys.fire = false;
    });
  }

  animateLoop(now) {
    const dt = Math.min(0.05, (now - this.lastTime) / 1000);
    this.lastTime = now;
    const time = now * 0.001;

    if (!this.isPaused) {
      this.timerAccum += dt;
      if (this.timerAccum >= 1.0 && !this.isStageClear && !this.player.dead) {
        this.timerAccum = 0;
        this.timeLeft = Math.max(0, this.timeLeft - 1);
        this.updateHUD();
        if (this.timeLeft <= 0) this.killPlayer();
      }

      this.updatePlayer(dt, time);
      this.updateEntities(dt, time);
      this.updateCamera(dt, time);
    }

    this.renderer.render(this.scene, this.camera);
    requestAnimationFrame(this.animateLoop);
  }
}

window.SuperMario3DGame = SuperMario3DGame;
  </script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.game = new SuperMario3DGame('game-canvas-container');
      window.inspector = new ModelInspectorStudio(window.game.factory);
    });
  </script>
